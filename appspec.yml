version: 0.0
os: linux

files:
  - source: /
    destination: /home/ec2-user/bank_app

hooks:
  BeforeInstall:
    - location: script/install_dependencies.sh
      timeout: 300
      runas: root

  ApplicationStop:
    - location: script/stop_server.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: script/start_server.sh
      timeout: 300
      runas: root